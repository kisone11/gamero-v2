name: gamero-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: gamero-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - gamero_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: gamero-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: gamero-minio
    command: server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: gamero
      MINIO_ROOT_PASSWORD: gamero123
      MINIO_API_CORS_ALLOW_ORIGIN: "http://127.0.0.1:5714,http://localhost:5714"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gamero_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: gamero-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  gamero_pgdata:
  gamero_minio:
